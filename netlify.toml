# PromptPaper on Netlify: the built single-page app, plus the one server
# function that reads a public share link.
#
# The relay is not duplicated. `netlify/functions/fetch-share.ts` is Netlify's
# modern default handler — it routes by method and calls the `POST` and `GET`
# exports of `api/fetch-share.ts`, and `vite-share-proxy.ts` serves the same
# `api/shareFetchCore.ts` during `npm run dev` and `npm run preview`, so the
# endpoint a developer tests locally and the endpoint a visitor reaches when
# deployed are the same code with the same rules.
#
# Two settings are load-bearing rather than decorative, and both come from how
# the relay is structured:
#
# - `node_bundler = "esbuild"`: the shim imports `../../api/fetch-share`, and
#   that imports `./shareFetchCore.ts`, which imports
#   `../src/lib/parsers/shareUrlParser.ts` — files outside the functions
#   directory. Without bundling, Netlify zips the single function file and its
#   first import points at nothing. esbuild follows them into the bundle, and
#   the `@/types/document` import in the allowlist disappears before it gets
#   there because it is an `import type`.
# - `NODE_VERSION`: Vite 8 asks for Node ^20.19 or >=22.12, and 24 is the
#   version this build was verified against. Pinning it stops the deploy from
#   silently moving to an image the build has not been run on.
#
# There is nothing to put in the Netlify UI. The relay reads no secret and no
# environment variable — `VITE_SHARE_PROXY_URL` exists only for a deployment
# that hosts the reader on another origin, and the reader is same-origin here.

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"

[functions]
  node_bundler = "esbuild"

# Listed before the app fallback, and forced, so a path the app also owns can
# never be answered with index.html instead of the reader.
[[redirects]]
  from = "/api/fetch-share"
  to = "/.netlify/functions/fetch-share"
  status = 200
  force = true

# Client-side routing: /documents, /import, /export/:id and the rest are React
# Router routes with no file behind them. Not forced, so a real file in `dist`
# is always served as itself.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
